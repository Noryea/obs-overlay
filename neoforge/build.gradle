plugins {
    id 'com.gradleup.shadow'
    id "me.shedaniel.unified-publishing" version "0.1.+"
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    neoForge {
        convertAccessWideners(tasks.named("shadowJar", Jar), "obs_overlay.accesswidener")
    }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge libs.neoforge

    implementation libs.cloth.config.neoforge

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''
}

jar {
    dependsOn shadowJar
    enabled = false
}

def mcVersion = libs.versions.minecraft.get()

unifiedPublishing {
    project {
        displayName = "[NeoForge $mcVersion] v$rootProject.mod_version"
        releaseType = "beta"
        gameVersions = ["26.1.x"]
        gameLoaders = ["neoforge"]

        mainPublication jar

        relations {
            depends {
                curseforge = "cloth-config"
                modrinth = "cloth-config"
            }
        }

        if (rootProject.hasProperty("curse_api_key") || System.getenv("CURSE_API_KEY") != null) {
            curseforge {
                token = rootProject.hasProperty("curse_api_key") ? rootProject.property("curse_api_key") : System.getenv("CURSE_API_KEY")
                id = rootProject.curseforge_id
                gameVersions.addAll "Java 25"
            }
        }

        if (rootProject.hasProperty("modrinth_key") || System.getenv("MODRINTH_TOKEN") != null) {
            modrinth {
                token = rootProject.hasProperty("modrinth_key") ? rootProject.property("modrinth_key") : System.getenv("MODRINTH_TOKEN")
                id = rootProject.modrinth_id
                version = "$rootProject.mod_version+$mcVersion-$project.name"
            }
        }
    }
}